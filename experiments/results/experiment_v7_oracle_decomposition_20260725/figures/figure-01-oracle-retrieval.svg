text{font-family:Arial,sans-serif;fill:#222}.title{font-size:20px;font-weight:700}.label{font-size:12px}.tick{font-size:10px;fill:#555}.grid{stroke:#ddd;stroke-width:1}.axis{stroke:#333;stroke-width:1.2}
</style>
